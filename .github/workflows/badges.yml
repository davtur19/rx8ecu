name: update-badges
on:
  push:
    branches: [ main ]
    # Only re-derive badges when a metric source actually changed.
    paths:
      - README.md
      - MANIFEST.md
      - c/**
      - symbols/**
      - roms/**
      - src/**
      - docs/**
      - tools/gen_badges.py
      - tools/cross_decode.py
      - .github/workflows/badges.yml
      - c/verified_addrs.txt
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # gen_badges.py computes the regression-check counts by actually running
      # tools/tests/test_decode_families.py --quick and
      # tools/tests/test_emulator_families.py (parsing their "N checks" line).
      # Both suites are pure-stdlib (no capstone, no sh-elf toolchain needed),
      # so no extra pip/toolchain step is required here; if a suite cannot run
      # on this host, gen_badges.py falls back to its constants.
      - name: Regenerate README badges
        run: python3 tools/gen_badges.py
      - name: Commit and push if changed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md MANIFEST.md
          if git diff --cached --quiet; then
            echo "No badge changes."
          else
            git commit -m "chore(badges): refresh README progress badges [skip ci]"
            git push
          fi
