name: update-badges
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate README badges
        run: python3 tools/gen_badges.py
      - name: Commit and push if changed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md MANIFEST.md
          if git diff --cached --quiet; then
            echo "No badge changes."
          else
            git commit -m "chore(badges): refresh README progress badges [skip ci]"
            git push
          fi
