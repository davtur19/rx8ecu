# CI for rx8ecu — Mazda RX-8 ECU firmware reverse-engineering project.
#
# Runs the full documented verification battery (VERIFICATION.md / REPLICATION.md)
# on every push/PR against main/master:
#
#   verify job  — byte-exact rebuild of all 9 public stock ROMs (make verify-all),
#                 host-compiled C behavior-equivalence suites (make c-test),
#                 C lifts vs emulated ROM cross-check (make c-emu).
#   tests job   — the full Python regression battery in ONE step via the
#                 project's parallel runner (tools/run_tests_parallel.py, the
#                 same code as `make test-fast`): it auto-discovers every
#                 c/tests/test_*.py and tools/tests/test_*.py suite (decode
#                 families incl. the GNU-as bulk round-trip, emulator families,
#                 per-function suites), so new suites are picked up without
#                 editing CI.  -j 4 uses the runner's 4 vCPUs (ubuntu-latest
#                 standard runner on a public repo; its default cpu_count-1
#                 would be 3 workers).
#
# The four jobs run in parallel and each fails the workflow on any failing step.
# (catalog job: determinism gate for tools/classify_functions.py + gen_catalog.py.)
#
# Environment reproduced from the local dev box:
#   - Python 3.14  (local: 3.14.6)
#   - capstone 5.0.9  (pinned in .github/requirements.txt; local may differ —
#     check `python3 -c 'import capstone; print(capstone.__version__)'`)
#   - sh-elf binutils 2.46  (installed by tools/get_toolchain.sh into
#     tools/toolchain/usr/bin — the repo's documented, rootless method:
#     apt-get download + dpkg-deb -x on Debian/Ubuntu; git-ignored, so CI
#     installs it fresh and caches the result).

name: CI

on:
  push:
    branches: [main, master]
    # Skip CI for docs-only pushes (verification battery is unaffected).
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/workflows/README.md'
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Match the local dev environment (Python 3.14.6 at time of writing).
  PYTHON_VERSION: "3.14"

jobs:
  # ---------------------------------------------------------------------------
  # verify: byte-exact rebuild + C suites + emulator cross-check
  # ---------------------------------------------------------------------------
  verify:
    name: Verify (byte-exact + C + emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: .github/requirements.txt

      - name: Install Python deps (capstone)
        run: python3 -m pip install --break-system-packages -r .github/requirements.txt

      - name: Cache sh-elf binutils toolchain
        id: tc-cache
        uses: actions/cache@v4
        with:
          path: tools/toolchain
          key: sh-elf-binutils-${{ runner.os }}-${{ hashFiles('tools/get_toolchain.sh') }}

      - name: Install sh-elf binutils toolchain
        if: steps.tc-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          ./tools/get_toolchain.sh

      - name: Sanity-check toolchain and capstone
        run: |
          tools/toolchain/usr/bin/sh-elf-as --version | head -1
          python3 -c 'import capstone; print("capstone", capstone.__version__)'

      - name: make verify-all (9/9 byte-exact ROM rebuild)
        run: make verify-all

      - name: make c-test (host-compiled behavior-equivalence suites)
        run: make c-test

      - name: make c-emu (C lifts vs emulated ROM, 5x100k random)
        run: make c-emu

  # ---------------------------------------------------------------------------
  # tests: Python regression suites (parallel to the verify job)
  # ---------------------------------------------------------------------------
  tests:
    name: Tests (Python suites)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: .github/requirements.txt

      - name: Install Python deps (capstone)
        run: python3 -m pip install --break-system-packages -r .github/requirements.txt

      - name: Cache sh-elf binutils toolchain
        id: tc-cache
        uses: actions/cache@v4
        with:
          path: tools/toolchain
          key: sh-elf-binutils-${{ runner.os }}-${{ hashFiles('tools/get_toolchain.sh') }}

      - name: Install sh-elf binutils toolchain
        if: steps.tc-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          ./tools/get_toolchain.sh

      # test_decode_families.py invokes sh-elf-as directly, so the local
      # toolchain must be on PATH (it skips the bulk round-trip gracefully
      # otherwise — we want it to run). The parallel runner inherits this env.
      # Canonical entry point: same code as `make test-fast`. It replaces the
      # old three steps (decode families, emulator families, serial for-loop
      # over c/tests/test_*.py) with one auto-discovering invocation.
      - name: Python suites (parallel runner, auto-discovery)
        run: |
          export PATH="$PWD/tools/toolchain/usr/bin:$PATH"
          python3 tools/run_tests_parallel.py -j 4

  # ---------------------------------------------------------------------------
  # catalog: determinism gate for the classifier + master-catalog generators.
  #
  # tools/classify_functions.py and tools/gen_catalog.py are run by hand with
  # no tests; this job re-runs them from a clean checkout and fails the
  # pipeline if they would modify the committed catalog artifacts, i.e. the
  # repo is in "catalog drift". Both generators are idempotent (pure stdlib,
  # no deps), so this gate must be green on every catalog-relevant push.
  #
  # Job-level path trigger: GHA has no job-level `paths:`/`paths-ignore:`
  # (those exist only under `on: push:`/`on: pull_request:`), so the gate uses
  # dorny/paths-filter to skip its steps unless catalog-relevant inputs
  # changed. The workflow-level `paths-ignore` above still skips the whole
  # workflow for docs/README-only pushes.
  # ---------------------------------------------------------------------------
  catalog:
    name: Catalog (determinism gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Changed catalog-relevant paths
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            catalog:
              - 'c/**'
              - 'symbols/**'
              - 'src/**'
              - 'tools/**'
              - 'roms/**'

      - name: Run classifier
        if: steps.changes.outputs.catalog == 'true'
        run: python3 tools/classify_functions.py

      - name: Run master-catalog generator
        if: steps.changes.outputs.catalog == 'true'
        run: python3 tools/gen_catalog.py

      - name: Assert no catalog drift
        if: steps.changes.outputs.catalog == 'true'
        run: |
          if ! git diff --exit-code -- \
            symbols/FUNCTION_CATEGORIES.csv \
            symbols/CATALOG_MASTER.csv \
            symbols/CATALOG_STATUS.md \
            symbols/NAMES_STATUS.md; then
            echo "::error::catalog drift: run 'make catalog classify' and commit the refresh"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # formal-cert: formal certification (tools/verify_formal.py) for ALL 9 stock
  # ROMs against their per-ROM declared configs (analysis/coverage/declared_*.csv).
  #
  # Measured total runtime on the dev box is ~31 s (2026-08-04) — well under
  # the 8-minute budget — so the job is activated on push/PR that touches the
  # verifier, its declared configs, or the annotated sources, and FAILS the
  # workflow if any ROM is not CERTIFIED (P3 LIVE / P4 unref / P5 LIVE != 0).
  # This is the `make cert` battery, mirrored as a hard CI gate.
  # ---------------------------------------------------------------------------
  formal-cert:
    name: Formal cert (9 ROMs)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python deps (capstone)
        run: python3 -m pip install --break-system-packages -r .github/requirements.txt

      - name: Changed formal-cert-relevant paths
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            formal:
              - 'src/**'
              - 'tools/verify_formal.py'
              - 'analysis/coverage/**'

      - name: Formal cert — all 9 ROMs (make cert)
        if: steps.changes.outputs.formal == 'true'
        run: make cert
