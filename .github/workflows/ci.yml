# CI for rx8ecu — Mazda RX-8 ECU firmware reverse-engineering project.
#
# Runs the full documented verification battery (VERIFICATION.md / REPLICATION.md)
# on every push/PR against main/master:
#
#   verify job  — byte-exact rebuild of all 9 public stock ROMs (make verify-all),
#                 host-compiled C behavior-equivalence suites (make c-test),
#                 C lifts vs emulated ROM cross-check (make c-emu).
#   tests job   — the full Python regression battery in ONE step via the
#                 project's parallel runner (tools/run_tests_parallel.py, the
#                 same code as `make test-fast`): it auto-discovers every
#                 c/tests/test_*.py and tools/tests/test_*.py suite (decode
#                 families incl. the GNU-as bulk round-trip, emulator families,
#                 per-function suites), so new suites are picked up without
#                 editing CI.  -j 4 uses the runner's 4 vCPUs (ubuntu-latest
#                 standard runner on a public repo; its default cpu_count-1
#                 would be 3 workers).
#
# The five jobs run in parallel and each fails the workflow on any failing step.
# (catalog job: determinism gate for tools/classify_functions.py + gen_catalog.py.)
# (suites job: durable emulator suite + firmware host check + explorer build+check.)
#
# Environment reproduced from the local dev box:
#   - Python 3.14  (local: 3.14.6)
#   - capstone 5.0.9  (pinned in .github/requirements.txt; local may differ —
#     check `python3 -c 'import capstone; print(capstone.__version__)'`)
#   - sh-elf binutils 2.46  (installed by tools/get_toolchain.sh into
#     tools/toolchain/usr/bin — the repo's documented, rootless method:
#     apt-get download + dpkg-deb -x on Debian/Ubuntu; git-ignored, so CI
#     installs it fresh and caches the result).
#
# Action-pinning note (2026-09-15): the 14 `uses:` below float on major tags
# (actions/checkout@v4, actions/setup-python@v5, actions/cache@v4,
# dorny/paths-filter@v3). Full SHA-pinning was deferred: no network-verified
# SHAs were available in this environment (no `gh`/API access, and SHAs must
# never be invented — a wrong SHA breaks CI worse than a floating tag).
# Revisit: resolve each tag via `gh api repos/<owner>/<repo>/commits/<tag>`
# and pin as `<ref> # <tag>`. Until then, .github/dependabot.yml
# (github-actions, weekly) keeps these tags auto-updated.

name: CI

on:
  push:
    branches: [main, master]
    # Skip CI for docs-only pushes (verification battery is unaffected).
    # P3-3 (review 2026-09-22): ignore ONLY docs/**. The previous blanket
    # '**/*.md' also skipped symbols/CATALOG_STATUS.md and
    # symbols/NAMES_STATUS.md — catalog-status changes must re-trigger the
    # catalog determinism gate, so markdown under symbols/ has to run CI.
    paths-ignore:
      - 'docs/**'
  pull_request:
    branches: [main, master]
  # P3-5: allow manual re-runs from the Actions UI/API (no path filtering
  # applies — runs the full battery on demand).
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Match the local dev environment (Python 3.14.6 at time of writing).
  PYTHON_VERSION: "3.14"

# B1/B4: run every step under bash (fail-fast; pipefail on, so a missing
# tool on the left of `tool --version | head -1` fails the step instead of
# passing on head's empty-input success).
defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------------
  # verify: byte-exact rebuild + C suites + emulator cross-check
  # ---------------------------------------------------------------------------
  verify:
    name: Verify (byte-exact + C + emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: .github/requirements.txt

      - name: Install Python deps (capstone)
        run: python3 -m pip install --break-system-packages -r .github/requirements.txt

      - name: Cache sh-elf binutils toolchain
        id: tc-cache
        uses: actions/cache@v4
        with:
          path: tools/toolchain
          key: sh-elf-binutils-${{ runner.os }}-${{ hashFiles('tools/get_toolchain.sh') }}

      - name: Install sh-elf binutils toolchain
        if: steps.tc-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          ./tools/get_toolchain.sh

      - name: Sanity-check toolchain and capstone
        run: |
          test -x tools/toolchain/usr/bin/sh-elf-as || { echo "ERROR: tools/toolchain/usr/bin/sh-elf-as not found or not executable"; exit 1; }
          tools/toolchain/usr/bin/sh-elf-as --version | head -1
          python3 -c 'import capstone; print("capstone", capstone.__version__)'

      - name: make verify-all (9/9 byte-exact ROM rebuild)
        run: make verify-all

      - name: make c-test (host-compiled behavior-equivalence suites)
        run: make c-test

      - name: make c-emu (C lifts vs emulated ROM, 5x100k random)
        run: make c-emu

  # ---------------------------------------------------------------------------
  # tests: Python regression suites (parallel to the verify job)
  # ---------------------------------------------------------------------------
  tests:
    name: Tests (Python suites)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # P3-1: make the suites' documented SPARK_N shard hook live in CI.
      # 100000 is each suite's built-in default (SPARK_N env override, see
      # c/tests/test_spark_*.py), so test strength is unchanged — but the
      # variable is now explicitly set, so a future default change cannot
      # silently alter what CI actually runs.
      SPARK_N: "100000"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: .github/requirements.txt

      - name: Install Python deps (capstone)
        run: python3 -m pip install --break-system-packages -r .github/requirements.txt

      - name: Cache sh-elf binutils toolchain
        id: tc-cache
        uses: actions/cache@v4
        with:
          path: tools/toolchain
          key: sh-elf-binutils-${{ runner.os }}-${{ hashFiles('tools/get_toolchain.sh') }}

      - name: Install sh-elf binutils toolchain
        if: steps.tc-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          ./tools/get_toolchain.sh

      # test_decode_families.py invokes sh-elf-as directly, so the local
      # toolchain must be on PATH (it skips the bulk round-trip gracefully
      # otherwise — we want it to run). The parallel runner inherits this env.
      # Canonical entry point: same code as `make test-fast`. It replaces the
      # old three steps (decode families, emulator families, serial for-loop
      # over c/tests/test_*.py) with one auto-discovering invocation.
      #
      # P1-1: c/tests/smoke_dtc_functions.py is smoke_*.py, NOT test_*.py,
      # so auto-discovery skips it — pass it as an explicit extra. The
      # runner's CLI (extras nargs='*') appends named files to the
      # discovered set (same mechanism `make test-fast` uses for
      # verify_emu), so folding it into this step runs smoke_dtc exactly
      # once; a separate runner step would re-run the whole discovered
      # battery a second time.
      - name: Python suites (parallel runner, auto-discovery + smoke_dtc)
        run: |
          export PATH="$PWD/tools/toolchain/usr/bin:$PATH"
          python3 tools/run_tests_parallel.py -j 4 c/tests/smoke_dtc_functions.py

      # c/tests/verify_emu.py is named verify_*.py, not test_*.py, so the
      # parallel runner's auto-discovery (test_*.py only) skips it unless
      # passed as an explicit extra (cf. `make test-fast`). Run it here
      # explicitly with the same canonical invocation as the verify job.
      - name: make c-emu (C lifts vs emulated ROM, explicit)
        run: make c-emu

  # ---------------------------------------------------------------------------
  # suites: durable emulator suite + firmware host check + explorer build+check
  #
  # B1: these three batteries were never gated in CI (only the C tests + the
  # Python subset ran). Each step fails the job on any failure.
  # ---------------------------------------------------------------------------
  suites:
    name: Suites (emu + firmware + explorer)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Emulator suite (make -C web/ecu-emu test, 126 tests)
        run: make -C web/ecu-emu test

      - name: Firmware host check (make -C firmware check)
        run: make -C firmware check

      - name: Firmware regression harnesses + tripwire (make -C firmware/tests check)
        run: make -C firmware/tests check

      # P1-2: `check` runs only the 22 model harnesses; the real-TU link
      # pilots (link/*.c linked against actual firmware sources — dtc.c,
      # uds.c, can.c, serial.c+timer.c, rtos.c, ...) live in the separate
      # `link-check` target. Link regressions (missing symbol, MMIO map,
      # section layout) must fail CI too.
      - name: Firmware link pilots (make -C firmware/tests link-check)
        run: make -C firmware/tests link-check

      # P3-6: build the ecu-emu dist FIRST (same order as pages.yml) —
      # build_site.py/check must see a fresh emu bundle, not a stale or
      # missing dist from a previous step.
      - name: Emu dist + explorer build + check (ecu-emu build + build_site.py + make check)
        run: |
          make -C web/ecu-emu build
          python3 web/explorer/build_site.py
          make -C web/explorer check

  # ---------------------------------------------------------------------------
  # catalog: determinism gate for the classifier + master-catalog generators.
  #
  # tools/classify_functions.py and tools/gen_catalog.py are run by hand with
  # no tests; this job re-runs them from a clean checkout and fails the
  # pipeline if they would modify the committed catalog artifacts, i.e. the
  # repo is in "catalog drift". Both generators are idempotent (pure stdlib,
  # no deps), so this gate must be green on every catalog-relevant push.
  #
  # Job-level path trigger: GHA has no job-level `paths:`/`paths-ignore:`
  # (those exist only under `on: push:`/`on: pull_request:`), so the gate uses
  # dorny/paths-filter to skip its steps unless catalog-relevant inputs
  # changed. The workflow-level `paths-ignore` above still skips the whole
  # workflow for docs/README-only pushes.
  # ---------------------------------------------------------------------------
  catalog:
    name: Catalog (determinism gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # P1-3: dorny/paths-filter@v3 needs `pull-requests: read` on
    # pull_request events (workflow-level is contents:read only). Kept
    # JOB-level, not workflow-level, so only the two jobs that actually use
    # paths-filter gain the permission. Job-level permissions fully replace
    # the workflow-level set for that job, hence `contents: read` is
    # restated here.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Changed catalog-relevant paths
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            catalog:
              - 'c/**'
              - 'symbols/**'
              - 'src/**'
              - 'tools/**'
              - 'roms/**'

      - name: Run classifier
        if: steps.changes.outputs.catalog == 'true'
        run: python3 tools/classify_functions.py

      - name: Run master-catalog generator
        if: steps.changes.outputs.catalog == 'true'
        run: python3 tools/gen_catalog.py

      - name: Assert no catalog drift
        if: steps.changes.outputs.catalog == 'true'
        run: |
          if ! git diff --exit-code -- \
            symbols/FUNCTION_CATEGORIES.csv \
            symbols/CATALOG_MASTER.csv \
            symbols/CATALOG_STATUS.md \
            symbols/NAMES_STATUS.md; then
            echo "::error::catalog drift: run 'make classify catalog' and commit the refresh"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # formal-cert: formal certification (tools/verify_formal.py) for ALL 9 stock
  # ROMs against their per-ROM declared configs (analysis/coverage/declared_*.csv).
  #
  # Measured total runtime on the dev box is ~31 s (2026-08-04) — well under
  # the 8-minute budget — so the job is activated on push/PR that touches the
  # verifier, its declared configs, or the annotated sources, and FAILS the
  # workflow if any ROM is not CERTIFIED (P3 LIVE / P4 unref / P5 LIVE != 0).
  # This is the `make cert` battery, mirrored as a hard CI gate.
  # ---------------------------------------------------------------------------
  formal-cert:
    name: Formal cert (9 ROMs)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # P1-3: same job-level pull-requests:read rationale as the catalog job
    # (dorny/paths-filter on pull_request; contents:read restated because
    # job-level permissions replace the workflow-level set).
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python deps (capstone)
        run: python3 -m pip install --break-system-packages -r .github/requirements.txt

      - name: Changed formal-cert-relevant paths
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            formal:
              - 'src/**'
              - 'tools/verify_formal.py'
              - 'analysis/coverage/**'
              # P2-2: `make cert` reads roms/stock/*.bin (CERT_ROMS list in
              # the root Makefile) — ROM image or Makefile changes must
              # re-run formal cert too.
              - 'roms/stock/**'
              - 'Makefile'

      - name: Formal cert — all 9 ROMs (make cert)
        if: steps.changes.outputs.formal == 'true'
        run: make cert
