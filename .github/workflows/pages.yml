# GitHub Pages for rx8ecu — RX-8 ECU Tools (Explorer + Emulator).
#
# Builds the static explorer (web/explorer/build_site.py — stdlib-only,
# deterministic), copies the ecu-emu dist, and deploys the combined
# web/explorer/dist to GitHub Pages with the modern Actions flow
# (upload-pages-artifact + deploy-pages).
#
# The landing page at dist/index.html links to explorer/ and emu/ subdirs.
#
# Action-pinning note (2026-09-15): the 4 `uses:` below float on major tags
# (actions/checkout@v4, actions/setup-python@v5,
# actions/upload-pages-artifact@v3, actions/deploy-pages@v4). Full
# SHA-pinning was deferred: no network-verified SHAs were available in this
# environment (no `gh`/API access, and SHAs must never be invented — a wrong
# SHA breaks CI worse than a floating tag). Revisit: resolve each tag via
# `gh api repos/<owner>/<repo>/commits/<tag>` and pin as `<ref> # <tag>`.
# Until then, .github/dependabot.yml (github-actions, weekly) keeps these
# tags auto-updated.
#
# Deploy gate (review P2-1, 2026-09-22): deploys are driven by workflow_run
# on a SUCCESSFUL "CI" completion instead of every push, so a red CI never
# publishes. Tradeoff: the site lags CI completion by the CI wall-clock, and
# if the CI workflow is ever renamed, the `workflows: [CI]` filter here must
# be renamed with it. Security (GitHub's recommended workflow_run pattern):
#   - this file always executes from the default branch (not the triggering
#     run's context), and
#   - `branches:` plus the build job's `event == 'push'` condition restrict
#     triggers to CI runs for pushes on main/master — pull_request runs
#     (fork-controlled checkouts) never deploy, and
#   - build checks out workflow_run.head_sha: the exact commit CI validated.
# Residual: workflow_dispatch still allows a manual deploy without a green
# CI (kept intentionally as the break-glass path).

name: Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

env:
  PYTHON_VERSION: "3.14"

jobs:
  # ---------------------------------------------------------------------------
  # build: checkout, regenerate everything, upload as Pages artifact
  # ---------------------------------------------------------------------------
  build:
    name: Build site (build_site.py + ecu-emu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # P2-1: publish only after CI succeeded (workflow_run push event), or on
    # an explicit manual dispatch (break-glass, see header). If this job is
    # skipped, the dependent deploy job is skipped too.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_run: check out the exact SHA the completed CI run
          # validated; manual dispatch: current default-branch tip.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build ecu-emu (copy src/ to dist/)
        run: make -C web/ecu-emu build

      - name: Regenerate the explorer site (single command, no dependencies)
        run: python3 web/explorer/build_site.py

      - name: Sanity-check the generated site
        run: |
          test -f web/explorer/dist/index.html
          test -f web/explorer/dist/explorer/index.html
          test -f web/explorer/dist/explorer/app.js
          test -f web/explorer/dist/explorer/style.css
          test -f web/explorer/dist/explorer/data.json
          test -f web/explorer/dist/explorer/data.js
          test -f web/explorer/dist/explorer/.nojekyll
          test -f web/explorer/dist/emu/index.html
          python3 -c "import json,sys; d=json.load(open('web/explorer/dist/explorer/data.json')); assert d['meta']['counts']['symbols']>0 and d['meta']['counts']['edges']>0; print('data.json OK:', d['meta']['counts']['symbols'], 'symbols,', d['meta']['counts']['edges'], 'edges')"

      # B5: the real deploy gate — a degraded build (e.g. 0 edges, missing
      # model files, addr_map/count mismatch) must not deploy. `make check`
      # reconciles 9 models / 8 value files / full counts.
      - name: Gate deploy on the real explorer check (make -C web/explorer check)
        run: make -C web/explorer check

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/explorer/dist

  # ---------------------------------------------------------------------------
  # deploy: publish the artifact to the github-pages environment
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
