<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
<!-- ECU component icon sprite — 24x24 viewBox, stroke-based, currentColor -->

<!-- Battery +12V -->
<symbol id="icon-battery" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <rect x="3" y="6" width="16" height="12" rx="2"/>
  <line x1="21" y1="10" x2="21" y2="14"/>
  <line x1="8" y1="12" x2="12" y2="12"/>
  <line x1="10" y1="10" x2="10" y2="14"/>
</symbol>

<!-- Alternator -->
<symbol id="icon-alternator" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="12" cy="12" r="8"/>
  <path d="M12 4v2M12 18v2M4 12h2M18 12h2"/>
  <path d="M12 8l-2 4h4l-2 4"/>
</symbol>

<!-- Ground / chassis -->
<symbol id="icon-ground" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <line x1="12" y1="4" x2="12" y2="12"/>
  <line x1="6" y1="12" x2="18" y2="12"/>
  <line x1="8" y1="15" x2="16" y2="15"/>
  <line x1="10" y1="18" x2="14" y2="18"/>
  <line x1="11" y1="21" x2="13" y2="21"/>
</symbol>

<!-- Ignition coil -->
<symbol id="icon-coil" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <path d="M6 4v4"/>
  <path d="M6 8c3 0 3-2 6-2s3 2 6 2"/>
  <path d="M6 8v8"/>
  <path d="M18 8v2"/>
  <path d="M18 10c-3 0-3 2-6 2s-3-2-6-2"/>
  <path d="M18 10v4"/>
  <path d="M6 16l4 4M6 16l-4 4"/>
</symbol>

<!-- Fuel injector -->
<symbol id="icon-injector" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <rect x="7" y="2" width="10" height="8" rx="2"/>
  <path d="M12 10v4"/>
  <path d="M8 14l4 8 4-8"/>
  <line x1="9" y1="14" x2="15" y2="14"/>
</symbol>

<!-- Crank trigger wheel (20-tooth with gap) -->
<symbol id="icon-crank" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="12" cy="12" r="7"/>
  <circle cx="12" cy="12" r="3"/>
  <!-- teeth as short radial lines -->
  <line x1="12" y1="3" x2="12" y2="5"/>
  <line x1="16.2" y1="3.8" x2="15.4" y2="5.6"/>
  <line x1="19" y1="7" x2="17.5" y2="8"/>
  <line x1="20.2" y1="11" x2="18.2" y2="11.2"/>
  <line x1="20.2" y1="13" x2="18.2" y2="12.8"/>
  <line x1="19" y1="17" x2="17.5" y2="16"/>
  <line x1="16.2" y1="20.2" x2="15.4" y2="18.4"/>
  <line x1="12" y1="21" x2="12" y2="19"/>
  <line x1="7.8" y1="20.2" x2="8.6" y2="18.4"/>
  <line x1="5" y1="17" x2="6.5" y2="16"/>
  <line x1="3.8" y1="13" x2="5.8" y2="12.8"/>
  <line x1="3.8" y1="11" x2="5.8" y2="11.2"/>
  <line x1="5" y1="7" x2="6.5" y2="8"/>
  <line x1="7.8" y1="3.8" x2="8.6" y2="5.6"/>
  <!-- gap indicator (missing tooth) -->
  <line x1="18.5" y1="8.5" x2="19.5" y2="7.5" stroke-dasharray="1,1"/>
</symbol>

<!-- Cam sensor -->
<symbol id="icon-cam" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="12" cy="12" r="7"/>
  <circle cx="12" cy="12" r="3"/>
  <rect x="11" y="2" width="2" height="3" rx="0.5"/>
  <rect x="18" y="11" width="3" height="2" rx="0.5"/>
  <rect x="11" y="19" width="2" height="3" rx="0.5"/>
  <rect x="3" y="11" width="3" height="2" rx="0.5"/>
</symbol>

<!-- NTC thermistor (ECT/IAT) -->
<symbol id="icon-thermistor" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="12" cy="14" r="5"/>
  <line x1="12" y1="14" x2="12" y2="4"/>
  <line x1="10" y1="4" x2="14" y2="4"/>
  <path d="M10 8h4l-1 3h-2l-1 3h4"/>
</symbol>

<!-- MAP sensor -->
<symbol id="icon-map" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <rect x="3" y="5" width="18" height="14" rx="2"/>
  <circle cx="12" cy="12" r="3"/>
  <path d="M12 9v-4"/>
  <path d="M10 5h4"/>
  <line x1="21" y1="10" x2="24" y2="10"/>
  <line x1="21" y1="14" x2="24" y2="14"/>
</symbol>

<!-- TPS (throttle position sensor) -->
<symbol id="icon-tps" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="12" cy="12" r="8"/>
  <path d="M12 4a8 8 0 0 1 0 16" stroke-dasharray="2,2"/>
  <line x1="12" y1="12" x2="16" y2="6"/>
  <circle cx="12" cy="12" r="1.5" fill="currentColor"/>
</symbol>

<!-- O2 sensor (narrowband) -->
<symbol id="icon-o2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <path d="M8 3v6c0 2-2 4-2 6v2h12v-2c0-2-2-4-2-6V3"/>
  <line x1="6" y1="17" x2="18" y2="17"/>
  <path d="M10 3c0 2 4 2 4 0"/>
</symbol>

<!-- Cooling fan -->
<symbol id="icon-fan" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="12" cy="12" r="9"/>
  <circle cx="12" cy="12" r="2"/>
  <path d="M12 10c-2-4-6-5-7-3s3 4 7 3"/>
  <path d="M14 12c4-2 5-6 3-7s-4 3-3 7"/>
  <path d="M12 14c2 4 6 5 7 3s-3-4-7-3"/>
  <path d="M10 12c-4 2-5 6-3 7s4-3 3-7"/>
</symbol>

<!-- Fuel pump relay -->
<symbol id="icon-fuel-pump" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <path d="M4 8h6v12H4z"/>
  <path d="M10 8l3-3h3a2 2 0 0 1 2 2v2"/>
  <path d="M16 7v4"/>
  <path d="M14 11h4"/>
  <line x1="10" y1="14" x2="18" y2="14"/>
  <path d="M10 14v4h6v-4"/>
  <line x1="13" y1="14" x2="13" y2="18"/>
</symbol>

<!-- CAN bus -->
<symbol id="icon-can" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <path d="M2 6h20M2 12h20M2 18h20"/>
  <circle cx="6" cy="6" r="1.5" fill="currentColor"/>
  <circle cx="10" cy="12" r="1.5" fill="currentColor"/>
  <circle cx="14" cy="18" r="1.5" fill="currentColor"/>
  <circle cx="18" cy="6" r="1.5" fill="currentColor"/>
  <circle cx="6" cy="12" r="1.5" fill="currentColor"/>
  <circle cx="18" cy="18" r="1.5" fill="currentColor"/>
</symbol>

<!-- SCI / serial -->
<symbol id="icon-sci" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <rect x="2" y="4" width="20" height="16" rx="2"/>
  <line x1="2" y1="8" x2="22" y2="8"/>
  <circle cx="5" cy="6" r="0.5" fill="currentColor"/>
  <circle cx="7" cy="6" r="0.5" fill="currentColor"/>
  <circle cx="9" cy="6" r="0.5" fill="currentColor"/>
  <path d="M6 12h2l2-2 2 4 2-4 2 2h2"/>
</symbol>

<!-- ECU box -->
<symbol id="icon-ecu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <rect x="3" y="3" width="18" height="18" rx="3"/>
  <line x1="3" y1="7" x2="21" y2="7"/>
  <line x1="3" y1="17" x2="21" y2="17"/>
  <circle cx="6" cy="5" r="0.7" fill="currentColor"/>
  <circle cx="8.5" cy="5" r="0.7" fill="currentColor"/>
  <path d="M7 10h10M7 12.5h10M7 15h6"/>
</symbol>

<!-- MIL / Check Engine lamp -->
<symbol id="icon-mil" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <path d="M12 2L3 18h18L12 2z"/>
  <line x1="12" y1="8" x2="12" y2="13"/>
  <circle cx="12" cy="15.5" r="0.7" fill="currentColor"/>
</symbol>

<!-- Resistor -->
<symbol id="icon-resistor" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <line x1="2" y1="12" x2="6" y2="12"/>
  <path d="M6 8l2 4-2 4-2-4z"/>
  <path d="M8 8l2 4-2 4-2-4z"/>
  <path d="M12 8l2 4-2 4-2-4z"/>
  <path d="M16 8l2 4-2 4-2-4z"/>
  <path d="M20 8l-2 4 2 4"/>
  <line x1="18" y1="12" x2="22" y2="12"/>
</symbol>

<!-- Switch -->
<symbol id="icon-switch" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="6" cy="16" r="2"/>
  <circle cx="18" cy="16" r="2"/>
  <line x1="6" y1="14" x2="16" y2="8"/>
</symbol>

<!-- Oil metering pump (OMP) -->
<symbol id="icon-omp" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="12" cy="12" r="7"/>
  <path d="M8 12a4 4 0 0 1 8 0"/>
  <path d="M10 10l2 2 2-2"/>
  <path d="M9 15h6"/>
</symbol>

<!-- Knock sensor -->
<symbol id="icon-knock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <rect x="5" y="6" width="14" height="12" rx="2"/>
  <path d="M9 10v4M12 8v8M15 10v4"/>
</symbol>

<!-- VVT solenoid -->
<symbol id="icon-vvt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <rect x="4" y="6" width="16" height="12" rx="2"/>
  <circle cx="12" cy="12" r="4"/>
  <path d="M12 8v-2M10 8h4"/>
  <path d="M10 16h4"/>
</symbol>

<!-- A/C clutch -->
<symbol id="icon-ac" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="12" cy="12" r="7"/>
  <circle cx="12" cy="12" r="3"/>
  <line x1="12" y1="5" x2="12" y2="9"/>
  <line x1="12" y1="15" x2="12" y2="19"/>
  <line x1="5" y1="12" x2="9" y2="12"/>
  <line x1="15" y1="12" x2="19" y2="12"/>
</symbol>

<!-- Vehicle speed sensor (VSS) -->
<symbol id="icon-speed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <path d="M12 21a9 9 0 1 1 0-18 9 9 0 0 1 0 18z"/>
  <path d="M12 21a9 9 0 0 0 0-18" stroke-dasharray="2,2"/>
  <line x1="12" y1="12" x2="16" y2="7"/>
  <circle cx="12" cy="12" r="1" fill="currentColor"/>
</symbol>

<!-- Stop lamp -->
<symbol id="icon-stop-lamp" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="12" cy="12" r="8"/>
  <circle cx="12" cy="12" r="5"/>
  <circle cx="12" cy="12" r="2" fill="currentColor"/>
</symbol>

<!-- Ignition switch -->
<symbol id="icon-ign-switch" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="10" cy="14" r="6"/>
  <path d="M10 8v-2M8 8h4"/>
  <line x1="14" y1="10" x2="20" y2="4"/>
  <circle cx="20" cy="4" r="1.5" fill="currentColor"/>
</symbol>

<!-- BSC bus -->
<symbol id="icon-bsc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <rect x="2" y="6" width="8" height="12" rx="1"/>
  <rect x="14" y="6" width="8" height="12" rx="1"/>
  <line x1="10" y1="10" x2="14" y2="10"/>
  <line x1="10" y1="14" x2="14" y2="14"/>
  <path d="M11 8l1 2-1 2"/>
  <path d="M13 8l-1 2 1 2"/>
</symbol>

</svg>
